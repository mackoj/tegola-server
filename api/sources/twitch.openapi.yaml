openapi: 3.1.0
info:
  title: Twitch OAuth client credentials (for IGDB)
  version: "1"
  description: |
    Written by tegola-server (D-23): Twitch publishes no OpenAPI description of its OAuth endpoints. Source:
    https://dev.twitch.tv/docs/authentication/getting-tokens-oauth/#client-credentials-grant-flow and
    https://api-docs.igdb.com/#authentication. The secret travels in the form body, never in the URL.
servers:
  - url: https://id.twitch.tv/oauth2
paths:
  /token:
    post:
      operationId: token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, client_secret, grant_type]
              properties:
                client_id: { type: string }
                client_secret: { type: string }
                grant_type: { type: string, enum: [client_credentials] }
      responses:
        "200":
          description: An app access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
                  token_type: { type: string }
