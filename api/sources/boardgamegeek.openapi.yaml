openapi: 3.1.0
info:
  title: BoardGameGeek XML API 2 (the part tegola-server uses)
  version: "2"
  description: |
    Written by tegola-server (D-23): BoardGameGeek publishes no OpenAPI description. Source:
    https://boardgamegeek.com/wiki/page/BGG_XML_API2. Answers are XML, which swift-openapi-generator leaves as a raw
    body: the server parses it itself (`<items>` root required, no DOCTYPE). BGG labels them `text/xml`. Requests carry
    `Authorization: Bearer <token>` (an approved application's token), added by a client middleware.
servers:
  - url: https://boardgamegeek.com/xmlapi2
paths:
  /search:
    get:
      operationId: search
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [boardgame] } }
      responses:
        "200":
          description: "`<items><item type id><name type value/><yearpublished value/></item></items>`"
          content:
            text/xml:
              schema: { type: string, contentEncoding: binary }
            application/xml:
              schema: { type: string, contentEncoding: binary }
  /thing:
    get:
      operationId: thing
      parameters:
        - { name: id, in: query, required: true, description: "Comma-separated ids.", schema: { type: string } }
        - { name: stats, in: query, schema: { type: integer, enum: [1] } }
      responses:
        "200":
          description: "`<items><item type id>` with names, players, times, links, images and statistics."
          content:
            text/xml:
              schema: { type: string, contentEncoding: binary }
            application/xml:
              schema: { type: string, contentEncoding: binary }
