# tegola-server behind Caddy (TLS), with Postgres for its keys (D-17), for production or a local rehearsal
# (docs/DEPLOY.md).
#   cp deploy/env.example .env   # then fill it in
#   docker compose up -d --build
# Rate limits are still in memory, per instance, so run exactly one tegola-server (D-9).
name: tegola

services:
  tegola-server:
    build: .
    image: tegola-server:local
    env_file: ${TEGOLA_ENV_FILE:-.env}
    environment:
      # Fixed by the topology, whatever the env file says.
      TEGOLA_HOST: 0.0.0.0
      TEGOLA_PORT: "8080"
      TEGOLA_TRUSTED_PROXY_HOPS: "1"
      # Postgres on the db network, which nothing else joins and which has no route out: no TLS needed there.
      TEGOLA_DATABASE_URL: "postgres://tegola:${TEGOLA_DB_PASSWORD:?set TEGOLA_DB_PASSWORD in .env}@postgres:5432/tegola?sslmode=disable"
    # Reachable only by Caddy, on the private network: no published port.
    expose: ["8080"]
    networks: [internal, db]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 15s

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: tegola
      POSTGRES_DB: tegola
      POSTGRES_PASSWORD: ${TEGOLA_DB_PASSWORD:?set TEGOLA_DB_PASSWORD in .env}
      # scram-sha-256 for every connection, the network's included.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # From Postgres 18 the image keeps its data under /var/lib/postgresql/<major>/docker and refuses a volume on the
    # old /var/lib/postgresql/data path (D-21).
    volumes:
      - postgres_data:/var/lib/postgresql
    # Only the server reaches it: no published port, an internal-only network.
    networks: [db]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    shm_size: 128m
    # The entrypoint needs these to hand the data directory to the postgres user, then drops to it.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tegola", "-d", "tegola"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # Only the domain: the server's secrets (debug token, source keys) never reach the proxy.
    environment:
      TEGOLA_DOMAIN: ${TEGOLA_DOMAIN:?set TEGOLA_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [tegola-server]
    restart: unless-stopped

networks:
  # Caddy ↔ server. Not internal-only: the server will call the lookup databases in M3.
  internal: {}
  public: {}
  # Server ↔ Postgres only, with no route out of the host.
  db:
    internal: true

volumes:
  # The keys. Back it up (docs/DEPLOY.md).
  postgres_data: {}
  # Certificates and ACME account: keep this volume, or Caddy asks for new certificates at every start.
  caddy_data: {}
  caddy_config: {}
