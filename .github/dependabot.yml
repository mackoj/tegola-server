# Weekly updates for GitHub Actions, the Dockerfile's base images, the Compose images and the Swift packages (D-19).
# Images are pinned by digest and actions by SHA (D-20): a bump moves tag and pin together. Each update is a PR that
# CI's gate and Docker smoke test must pass. CI's own `container:` and `services:` images aren't bumped by Dependabot:
# move them in the same PR (scripts/pin-check.sh fails until they match).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
