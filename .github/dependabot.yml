# Weekly updates for what the build trusts by tag: GitHub Actions, the Dockerfile's base images, the Compose images,
# and the Swift packages (DECISIONS D-19). Each update is a PR that CI's gate and Docker smoke test must pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
